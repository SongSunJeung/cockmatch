<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <base href="/cockmatch/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#F8FAFC">
  <meta name="description" content="배드민턴 클럽 모임·출석·대진표·금전출납부 통합 관리 웹앱 쓸만한 민턴총무">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="쓸만한 민턴총무">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=20260929_3"/>

  <title>쓸만한 민턴총무</title>
  <link rel="manifest" href="manifest.json?v=20260929_3">
  <style>
    html, body, flutter-view, flt-glass-pane {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 100dvh !important;
      background-color: #F8FAFC !important;
      overflow: hidden !important;
      overscroll-behavior: none !important;
    }
  </style>
  <script>
    // 브라우저 이전 캐시 및 Service Worker 완전 무효화 (Cache Busting)
    (function() {
      var APP_VERSION = '20260929_3';
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        var savedVersion = localStorage.getItem('cockmatch_build_version');
        if (savedVersion !== APP_VERSION) {
          localStorage.setItem('cockmatch_build_version', APP_VERSION);
          if ('caches' in window) {
            caches.keys().then(function(names) {
              return Promise.all(names.map(function(name) { return caches.delete(name); }));
            });
          }
        }
      } catch (e) {}

      // Flutter 웹 엔진이 viewport 메타태그를 덮어쓸 때 viewport-fit=cover 유지
      var ensureViewportFit = function() {
        var metas = document.querySelectorAll('meta[name="viewport"]');
        for (var i = 0; i < metas.length; i++) {
          var content = metas[i].getAttribute('content') || '';
          if (content.indexOf('viewport-fit=cover') === -1) {
            metas[i].setAttribute('content', content + ', viewport-fit=cover');
          }
        }
      };
      if (window.MutationObserver) {
        new MutationObserver(ensureViewportFit).observe(document.head, { childList: true, subtree: true, attributes: true });
      }
      window.addEventListener('DOMContentLoaded', ensureViewportFit);
      window.addEventListener('resize', ensureViewportFit);
    })();
  </script>
</head>
<body>
  <script src="flutter.js?v=20260929_3" defer></script>
  <script src="flutter_bootstrap.js?v=20260929_3" async></script>
</body>
